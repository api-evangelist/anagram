name: Anagram
description: 'Anagram (operated by Enigma Analytics, Inc.) is a security-awareness and
  human-risk training platform for enterprises, positioned in the defense and government
  sector and backed by General Catalyst. The product replaces check-the-box compliance
  training with engaging, gamified experiences proven to change risky behavior: role- and
  geography-adaptive phishing simulations (Smart Phishing), developer-designed secure-coding
  challenges for engineering teams, and a real-time AI coaching layer (Anagram Agent).
  Anagram is not currently a public API provider — this profile captures the company
  identity, product surface, and public web properties for the API Evangelist network.'
